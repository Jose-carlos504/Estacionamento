<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ParkEasy - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0d1229 100%);
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before{
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(99, 130, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(138, 100, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(79, 172, 254, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .form-card{
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .form-card::before{
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        .form-header{
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header .logo{
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .form-header .logo-icon{
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6382ff 0%, #8a64ff 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .form-header h1{
            color: white;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .form-header p{
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
        }

        label{
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
        }

        input{
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input::placeholder{
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus{
            outline: none;
            border-color: rgba(99, 130, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(99, 130, 255, 0.1);
        }

        button{
            background: linear-gradient(135deg, #6382ff 0%, #8a64ff 100%);
            color: white;
            border: none;
            padding: 18px 24px;
            width: 100%;
            border-radius: 14px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        button:hover{
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(99, 130, 255, 0.4);
        }

        .error{
            color: #ff6b6b;
            font-size: 13px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(255, 107, 107, 0.2);
            text-align: center;
        }

        .form-links{
            text-align: center;
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-links a{
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .form-links a:hover{
            color: white;
        }

        .form-links .guest-link{
            color: rgba(99, 130, 255, 0.9);
            font-weight: 500;
        }

        @media (max-width: 768px){
            .form-card{
                padding: 32px;
                margin: 20px;
            }
        }

    </style>
</head>
<body>

    <div class="form-card">
        <div class="form-header">
            <div class="logo">
                <div class="logo-icon">P</div>
                ParkEasy
            </div>
            <h1>Login</h1>
            <p>Acesso para gestores e administradores</p>
        </div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <label for="username">Usuário</label>
            <input 
                type="text" 
                id="username" 
                name="username" 
                placeholder="Digite seu usuário" 
                required
                autocomplete="username"
            >

            <label for="password">Senha</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Digite sua senha" 
                required
                autocomplete="current-password"
            >

            <button type="submit">
                Entrar
            </button>
        </form>

        <div class="form-links">
            <a href="{% url 'home' %}" class="guest-link">← Voltar para o sistema</a>
        </div>
    </div>

</body>
</html>
